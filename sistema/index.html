    /* Quem chega aqui tocou no link da DM do Instagram: a página nasce para o celular.
       Vídeo vertical 9:16; no computador a coluna para em 420 px e fica no centro. */
    html,body{background:#0D1B3E;color:#fff;margin:0;}
    .sis{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;max-width:420px;margin:0 auto;box-sizing:border-box;padding:22px 18px 28px;}

    .sub{margin:0 0 18px;font-size:1rem;line-height:1.45;opacity:.85;}
    .tela{position:relative;width:100%;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);}
    .tela video{display:block;width:100%;height:100%;object-fit:contain;background:#000;}
    .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;width:100%;box-sizing:border-box;padding:17px 18px;border-radius:10px;background:#fff;color:#0D1B3E;font-family:var(--sans);font-weight:700;font-size:1.05rem;text-decoration:none;}
    .btn-wa svg{width:22px;height:22px;flex:none;}
    .btn-wa:active{transform:translateY(1px);}
    .assina{margin:16px 0 0;font-size:.9rem;line-height:1.5;opacity:.8;text-align:center;}
    .assina span{white-space:nowrap;}
    @media (min-width:760px){
      .sis{padding:36px 0 40px;}
      h1{font-size:1.9rem;text-align:center;}
      .sub{text-align:center;}
      /* No computador o vídeo encolhe com a altura da janela para o botão aparecer sem rolar. */
      .tela,.btn-wa{width:min(100%,calc((100vh - 290px) * 9 / 16));min-width:300px;margin-left:auto;margin-right:auto;}
      .sis-top{justify-content:center;}

<script>
(function(){
  var q=new URLSearchParams(location.search);
  var src=(q.get('utm_source')||'').toLowerCase();

  // A palavra da DM (utm_content = agenda | lucro) entra na frase do WhatsApp, em maiúsculas.
  // Só letras, até 20: qualquer outra coisa vira a frase sem parênteses.
  var palavra=(q.get('utm_content')||'').trim();
  if(!/^[A-Za-z]{2,20}$/.test(palavra)) palavra='';
  palavra=palavra.toUpperCase();
  var frase='Vi o vídeo do sistema'+(palavra?' ('+palavra+')':'')+' e quero saber como funciona no meu consultório';
  document.getElementById('wa').href='https://wa.me/5521999426534?text='+encodeURIComponent(frase);

  // Origem: os links da DM já trazem utm_medium=dm, e o praxys-tracking.js grava como veio.
  // Se algum link chegar do Instagram sem utm_medium, o script completaria com "pago":
  // aqui é DM (orgânico), não anúncio, então corrige para instagram / dm / palavra.
  // Link de anúncio (utm_medium=paid ou fbclid) nunca entra aqui: grava como veio.
  if(src==='instagram' && !q.get('utm_medium') && !q.get('fbclid')){
    try{
      var o=JSON.parse(localStorage.getItem('praxys_origem')||'null');
      if(o && o.utm_source==='instagram' && o.utm_medium==='pago'){
        o.utm_medium='dm';
        if(!q.get('utm_campaign')) o.utm_campaign='palavra';
        localStorage.setItem('praxys_origem',JSON.stringify(o));
      }
    }catch(_){}
  }

  // Acesso à página: contador + GA4 + evento personalizado no Pixel
  // (sistema_visita_agenda / sistema_visita_lucro = DM da palavra; sistema_visita = outra origem)
  try{ window.praxysTrack && praxysTrack(palavra?'sistema_visita_'+palavra.toLowerCase():'sistema_visita'); }catch(_){}

  // Quanto do vídeo foi visto: play, metade, fim (uma vez cada)
  var v=document.getElementById('v'), feito={};
  function marca(ev){ if(feito[ev]) return; feito[ev]=1; try{ window.praxysTrack && praxysTrack(ev); }catch(_){} }
  v.addEventListener('play',function(){ marca('sistema_play'); });
  v.addEventListener('timeupdate',function(){ if(v.duration && v.currentTime/v.duration>=0.5) marca('sistema_50'); });
  v.addEventListener('ended',function(){ marca('sistema_fim'); });
})();
</script>
